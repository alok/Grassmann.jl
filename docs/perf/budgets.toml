ratio = 49
note = "Values Float n is a heap FloatArray: every vector-valued op allocates (~10 ns with RC) and reductions are Nat-indexed, bounds-checked loops without unrolling or SIMD; Julia Values is an isbits tuple in registers. Fix: generated unrolled kernels for small n (as Grassmann) or unboxed-field structs for n <= 4."
