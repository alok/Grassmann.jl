# IEEEFloat.parse? scans a List Char into a Nat and converts exactly through ofDecimal (bignum) for every input; Julia calls strtod. Fix: Clinger fast path (mantissa < 2^53, |exp10| <= 22: one exact multiply or divide) and String.Iterator scanning.
[[budget]]
pattern = "juliabase/parse_float"
ratio = 10.5
note = "Byte state machine, Clinger's fast path, then Eisel-Lemire (Go's eiselLemire64) with an exact 128-bit table; the rest is the scan through String.getUTF8Byte with Nat indices and Int exponent bookkeeping."

# StepRangeLen.get converts its index with Float.ofInt (Int -> Nat -> OfScientific, ~35 ns); (i - r.offset).toInt64.toFloat is the same value for every Julia Int index.
[[budget]]
pattern = "juliabase/range_collect"
ratio = 8.2
note = "StepRangeLen.get converts i - offset inline (Int64); collect pushes one element at a time into a FloatArray (an out-of-line push per element)."
[[budget]]
pattern = "juliabase/range_getindex"
ratio = 4.6
note = "StepRangeLen.get converts i - offset inline (Int64); collect pushes one element at a time into a FloatArray (an out-of-line push per element)."

# StepRangeLen.get converts its index with Float.ofInt (Int -> Nat -> OfScientific, ~35 ns); (i - r.offset).toInt64.toFloat is the same value for every Julia Int index.
[[budget]]
pattern = "juliabase/colon_collect"
ratio = 8.1
note = "StepRangeLen.get converts i - offset inline (Int64); collect pushes one element at a time into a FloatArray (an out-of-line push per element)."

# Bit-exact replay of the 8-accumulator SIMD layout of Julia sum with bounds-checked FloatArray reads; the C backend does not vectorize. Fix: a USize/uget loop that clang can vectorize, keeping the accumulator order.
[[budget]]
pattern = "juliabase/sum_f64"
ratio = 5.2
note = "Bit-exact replay of Julia's 2x4-accumulator SIMD layout with USize/uget reads; clang does not vectorize the replay."

# powInt 10.0 d with an Int d per call (Float.ofInt and toIntTrunc through Int); a table of the exact powers 10^0..10^22 gives identical results.
[[budget]]
pattern = "juliabase/round_digits"
ratio = 2.4
note = "Exact powers of ten from a table and a specialized bench loop; F64.round and Int bookkeeping remain."

# Julia ComplexF64 algorithms on Julia kernels; ssqs returns a (Float x Int) pair (a boxed Float, Int exponent arithmetic) and the kernels pay out-of-line float_to_bits calls.
[[budget]]
pattern = "juliabase/complex_div"
ratio = 5.9
note = "Julia ComplexF64 algorithms on Julia kernels; ssqs returns a (Float x Int) pair (a boxed Float, Int exponent arithmetic) and the kernels pay out-of-line float_to_bits calls."
[[budget]]
pattern = "juliabase/complex_exp"
ratio = 3.6
note = "Inline ComplexF64.exp; the remaining cost is F64.exp plus sincos (Payne-Hanek for the ~17% of arguments beyond 2^20·π/2)."
[[budget]]
pattern = "juliabase/complex_log"
ratio = 2.0
note = "Inline ComplexF64.log and ssqs, Int64 exponent conversion; measured 1.4x."
[[budget]]
pattern = "juliabase/complex_sqrt"
ratio = 2.0
note = "Inline ComplexF64.sqrt (no boxed result) and ssqs; measured 1.5x."

