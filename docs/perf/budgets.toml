# Budgets: the maximum Lean/Julia ratio (of the minima) per case, or an absolute `max_ns`.
# The first rule whose shell pattern matches a key applies; `default` covers everything else.
# `scripts/bench/compare.py --guard` fails when a case exceeds its budget or its Lean time
# regresses by more than 20% against the previous run on the same machine.
#
# Target: within 2x of Julia everywhere (DESIGN.md asks for ~1.5x on the hot paths). The rules
# below record the known gaps as measured on 2026-09-25 (docs/perf/latest.md) with 30% headroom
# and a diagnosis; tighten a rule when its gap is fixed.

default = 2.0

# TruthValues N stores a BitVec (2^N): at N = 6 every column >= 2^63 is a GMP bignum and each connective allocates; Julia uses one UInt64. Fix: UInt64 storage for N <= 6.
[[budget]]
pattern = "demorgan/tv_formula_N6"
ratio = 2100
note = "TruthValues N stores a BitVec (2^N): at N = 6 every column >= 2^63 is a GMP bignum and each connective allocates; Julia uses one UInt64. Fix: UInt64 storage for N <= 6."

# Expression names are built by String concatenation and the class arrays are copied in combine.
[[budget]]
pattern = "demorgan/truthtable_N4"
ratio = 3.1
note = "Expression names are built by String concatenation and the class arrays are copied in combine."

# Values Float n is a heap FloatArray: every vector-valued op allocates (~10 ns with RC) and reductions are Nat-indexed, bounds-checked loops without unrolling or SIMD; Julia Values is an isbits tuple in registers. Fix: generated unrolled kernels for small n (as Grassmann) or unboxed-field structs for n <= 4.
