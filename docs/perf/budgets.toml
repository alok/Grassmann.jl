# Leibniz.bladeRankImpl evaluates 2 ^ n (Nat.pow -> GMP mpz_pow_ui) on every call and binomsum re-sums choose n q; use b >>> n == 0 and the table offsets.
[[budget]]
pattern = "directsum/basis_index_n10"
ratio = 2.8
note = "Table read (mask -> layout position) behind @[implemented_by]; the Thunk access of the per-n tables and Nat boxing remain."

# printLabel builds labels through List/String concatenation. Also a semantic difference (check differs): Lean prints subscript 0 for generator 10 where Julia prints v10 (Leibniz printindex label rule for n >= 10).
[[budget]]
pattern = "directsum/blade_show_R10"
ratio = 6.9
note = "Labels pushed char by char from glyph tables (plain spaces straight from the mask bits); Julia converts cached Symbols."

# Gram/Chevalley product evaluated per call over Rat terms (an allocation per term); kernels should read plan tables (DESIGN 5.3) instead of recomputing blade algebra.
