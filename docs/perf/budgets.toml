# IEEEFloat.parse? scans a List Char into a Nat and converts exactly through ofDecimal (bignum) for every input; Julia calls strtod. Fix: Clinger fast path (mantissa < 2^53, |exp10| <= 22: one exact multiply or divide) and String.Iterator scanning.
[[budget]]
pattern = "juliabase/parse_float"
ratio = 98
note = "IEEEFloat.parse? scans a List Char into a Nat and converts exactly through ofDecimal (bignum) for every input; Julia calls strtod. Fix: Clinger fast path (mantissa < 2^53, |exp10| <= 22: one exact multiply or divide) and String.Iterator scanning."

