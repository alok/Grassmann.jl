# Bit-exact replay of the 8-accumulator SIMD layout of Julia sum with bounds-checked FloatArray reads; the C backend does not vectorize. Fix: a USize/uget loop that clang can vectorize, keeping the accumulator order.
[[budget]]
pattern = "juliabase/sum_f64"
ratio = 8.3
note = "Bit-exact replay of the 8-accumulator SIMD layout of Julia sum with bounds-checked FloatArray reads; the C backend does not vectorize. Fix: a USize/uget loop that clang can vectorize, keeping the accumulator order."

