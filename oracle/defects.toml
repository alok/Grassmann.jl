# oracle/defects.toml: known Julia defects that the oracle goldens exhibit.
#
# The Lean port implements the *correct* mathematics (DESIGN.md §0: "documented Julia defects ...
# we fix, not replicate"), so golden cases hitting a defect must be skipped or compared against
# the corrected value. The generator tags every matching case with `"defects": [id, ...]`;
# consumers normally just read that array. The match patterns below are the source of truth
# (regenerate after editing: `julia --project=oracle oracle/generate_all.jl`).
#
# Entry fields
#   id       stable identifier used in the goldens
#   title    one-line description
#   source   Julia file:line (Grassmann 0.8.46 / DirectSum 0.8.21 / Leibniz 0.3.0 / AT 0.8.11)
#   notes    port-note references (docs/port-notes/*.md)
#   correct  what the Lean port does instead
#   policy   how a consumer treats tagged cases:
#              "ref"        compare the dense vector against the case's `ref` when it has one
#                           (the generator's independent reference: linear combination for
#                           arith, Multivector path for products/unary); otherwise, if `out`
#                           is an Error, skip; otherwise the case was not actually affected
#                           and is compared against `out` as usual
#              "skip"       skip the case (no trustworthy expected value in the golden)
#              "replicate"  Julia's behavior is intentionally reproduced; compare against `out`
#   match    zero or more match tables; a case is tagged if ANY table matches. Within a table
#            every given field must match:
#              suite, space, op, block, input, file, msg, out : glob with `*` wildcards and
#                         `|` alternatives (`msg` is the error message of an Error output, `out`
#                         the output kind, `block`/`input`/`file` apply to the docs/blades suites)
#              kinds    : one pattern per operand, each `Kind` or `Kind:g` (g an integer or `n` =
#                         the space's top grade) with `|` alternatives, or `*`
#              when     : a named predicate (oracle/README.md "Defect predicates")
# Entries without match tables are documented defects that no generated golden exercises
# (kept so the list is complete; several of them crash or hang Julia and are avoided on purpose).

schema = 1

