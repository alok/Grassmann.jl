# Documented defects of MeshTopology.jl 0.1.0 (port-notes/meshtopology.md §8.6).
#
# `fixed` entries are patched in `Fixed.MeshTopology` by oracle/meshtopology/load.jl (one textual
# fix each); the Lean port implements the fixed semantics and the goldens record the upstream
# value next to it as {"fixed": …, "julia": …}. `replicated` entries are kept for parity (the
# Lean docstrings say so). Ids Q1-Q30 are the port notes' Q-list; Q18g and Q31-Q35 were found while
# writing the oracle.

[Q1]
status = "fixed"
where = "LG:21; EL:53,90,109,127,147,152; QT:382,389"
what = "Grassmann, Leibniz, Submanifold and ∂ are used but not imported: every Lagrange constructor, edges/adjacency for N ≥ 3, faces, facets, skeleton, facetsinterior, _facetsindices and compact resample throw UndefVarError. Both oracle modules add the import."

[Q2]
status = "fixed"
where = "QT:185-186"
what = "iscompact(::CompactTopology) is a MethodError; intended O == 2N."

[Q3]
status = "fixed"
where = "GR:163"
what = "1-D elementfuns compares a Values with an Int (MethodError); intended linear index of m[i]."

[Q4]
status = "fixed"
where = "GR:52"
what = "1-D linearelements broadcasts over values instead of cells (MethodError)."

[Q5]
status = "fixed"
where = "GR:55"
what = "4-D linearelements uses s[3]-1 for the w range."

[Q6]
status = "replicated"
where = "GR:162"
what = "getlinear is the identity for N ≥ 3, so only collapse flags identify nodes; Lean adds elementfunsClosed."

[Q7]
status = "replicated"
where = "GR:164-198"
what = "The 2-D min rule is one step and not transitive: Möbius/Hopf corners are merged wrongly, Klein and even-length half-turns leave duplicate nodes; Lean adds elementfunsClosed (union-find)."

