name = "Grassmann"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Grassmann"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

# Build in release mode for optimizations
[buildOptions]
release = true

# SciLean brings in mathlib, so we don't need to specify it separately
[[require]]
name = "scilean"
path = "/Users/alokbeniwal/scilean"

[[require]]
name = "LeanPlot"
path = "/Users/alokbeniwal/leanplot"

[[lean_lib]]
name = "Grassmann"

[[lean_exe]]
name = "genmetalshaders"
root = "GenMetalShaders"

[[lean_exe]]
name = "genvectorfield"
root = "Grassmann.GenVectorField"

[[lean_exe]]
name = "jlexamples"
root = "RunJuliaExamples"

[[lean_exe]]
name = "oracletests"
root = "RunOracleTests"

[[lean_exe]]
name = "propertytests"
root = "RunPropertyTests"
moreLinkArgs = ["-L/opt/homebrew/opt/openblas/lib", "-lblas"]

[[lean_exe]]
name = "bench"
root = "Grassmann.Bench"
precompileModules = false
# BLAS linking for SciLean-backed DataArray operations
moreLinkArgs = ["-L/opt/homebrew/opt/openblas/lib", "-lblas"]


