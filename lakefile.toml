name = "Grassmann"
version = "0.1.0"
description = "Lean 4 port of Michael Reed's Grassmann.jl ecosystem (DirectSum, Leibniz, AbstractTensors, Grassmann, Cartan, ...)"
keywords = ["math", "geometric-algebra", "clifford-algebra", "differential-geometry"]
license = "AGPL-3.0-or-later"
defaultTargets = ["JuliaBase", "StaticVectors", "AbstractTensors", "Leibniz", "DirectSum", "Grassmann", "FieldAlgebra", "FieldConstants", "UnitSystems", "Similitude", "MeasureSystems", "Dendriform", "DeMorgan", "AbstractLattices", "AbstractAnalysis", "Wilkinson", "PrimitiveBits", "tests", "bench"]
testDriver = "tests"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true
maxRecDepth = 4096

[[lean_lib]]
name = "JuliaBase"

[[lean_lib]]
name = "StaticVectors"

[[lean_lib]]
name = "AbstractTensors"

[[lean_lib]]
name = "Leibniz"

[[lean_lib]]
name = "DirectSum"

[[lean_lib]]
name = "Grassmann"

[[lean_lib]]
name = "Tests"

[[lean_lib]]
name = "Bench"

[[lean_exe]]
name = "tests"
root = "Tests.Main"

[[lean_exe]]
name = "bench"
root = "Bench.Main"

[[lean_lib]]
name = "FieldAlgebra"

[[lean_lib]]
name = "FieldConstants"

[[lean_lib]]
name = "UnitSystems"

[[lean_lib]]
name = "Similitude"

[[lean_lib]]
name = "MeasureSystems"

[[lean_lib]]
name = "Dendriform"

[[lean_lib]]
name = "DeMorgan"

[[lean_lib]]
name = "AbstractLattices"

[[lean_lib]]
name = "AbstractAnalysis"

[[lean_lib]]
name = "Wilkinson"

[[lean_lib]]
name = "PrimitiveBits"
