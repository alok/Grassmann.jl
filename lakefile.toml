name = "Grassmann"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Grassmann"]
restoreAllArtifacts = true

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "32d24245c7a12ded17325299fd41d412022cd3fe"

[[input_file]]
name = "multivectorFieldWidget"
path = "Grassmann4/GrassmannViz/multivectorField.js"
text = true

[[lean_lib]]
name = "Grassmann"
srcDir = "Grassmann4"

[[lean_lib]]
name = "GrassmannReference"
srcDir = "Grassmann4"

[[lean_lib]]
name = "GrassmannFields"
srcDir = "Grassmann4"

[[lean_lib]]
name = "GrassmannViz"
srcDir = "Grassmann4"
needs = ["multivectorFieldWidget"]

[[lean_lib]]
name = "GrassmannTests"
srcDir = "Grassmann4"
roots = ["GrassmannTests", "Grassmann.All"]

[[lean_exe]]
name = "genmetalshaders"
root = "GenMetalShaders"
srcDir = "Grassmann4"

[[lean_exe]]
name = "genvectorfield"
root = "Grassmann.GenVectorField"
srcDir = "Grassmann4"

[[lean_exe]]
name = "oracletests"
root = "RunOracleTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "propertytests"
root = "RunPropertyTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "fixedkerneltests"
root = "FixedKernelTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "fatdottests"
root = "FatDotTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "pga3kerneltests"
root = "PGA3KernelTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "bench"
root = "Grassmann.Bench"
srcDir = "Grassmann4"

[[lean_exe]]
name = "packedmvbench"
root = "RunPackedMVBench"
srcDir = "Grassmann4"
precompileModules = false

[[lean_exe]]
name = "jlexamples"
root = "RunJuliaExamples"
srcDir = "Grassmann4"

[[lean_exe]]
name = "multivectorfieldtests"
root = "MultivectorFieldTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "multivectorfallback"
root = "GenerateMultivectorFallback"
srcDir = "Grassmann4"


