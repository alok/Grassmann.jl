name = "Grassmann"
version = "0.1.0"
description = "Lean 4 port of Michael Reed's Grassmann.jl ecosystem (DirectSum, Leibniz, AbstractTensors, Grassmann, Cartan, ...)"
keywords = ["math", "geometric-algebra", "clifford-algebra", "differential-geometry"]
license = "AGPL-3.0-or-later"
defaultTargets = ["StaticVectors", "Leibniz", "DirectSum"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true

[[lean_lib]]
name = "StaticVectors"

[[lean_lib]]
name = "DirectSum"

[[lean_lib]]
name = "Leibniz"
