name = "Grassmann"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["Grassmann"]

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "32d24245c7a12ded17325299fd41d412022cd3fe"

# Temporarily disabled - Verso dependency issues
# [[require]]
# name = "LeanPlot"
# path = "/Users/alokbeniwal/leanplot"

[[lean_lib]]
name = "Grassmann"
srcDir = "Grassmann4"

[[lean_exe]]
name = "genmetalshaders"
root = "GenMetalShaders"
srcDir = "Grassmann4"

[[lean_exe]]
name = "genvectorfield"
root = "Grassmann.GenVectorField"
srcDir = "Grassmann4"

[[lean_exe]]
name = "oracletests"
root = "RunOracleTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "propertytests"
root = "RunPropertyTests"
srcDir = "Grassmann4"

[[lean_exe]]
name = "bench"
root = "Grassmann.Bench"
srcDir = "Grassmann4"

[[lean_exe]]
name = "packedmvbench"
root = "RunPackedMVBench"
srcDir = "Grassmann4"
precompileModules = false

[[lean_exe]]
name = "jlexamples"
root = "RunJuliaExamples"
srcDir = "Grassmann4"


