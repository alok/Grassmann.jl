name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Install repository script dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
      - name: Share the outer Lake workspace with package-layout checks
        run: |
          test -d .lake
          ln -s ../.lake Grassmann4/.lake
          ln -s ../../../.lake Grassmann4/tests/downstream/.lake
          test "$(readlink Grassmann4/.lake)" = "../.lake"
          test "$(readlink Grassmann4/tests/downstream/.lake)" = "../../../.lake"
      - name: Verify public libraries and offline field demo
        run: |
          lake build Grassmann GrassmannReference GrassmannFields GrassmannViz GrassmannTests
          Grassmann4/scripts/multivector_meetup_preflight.sh
      - name: Verify separate downstream package
        working-directory: Grassmann4/tests/downstream
        run: |
          lake build
          lake exe grassmann-downstream-smoke
      - uses: leanprover-community/docgen-action@v1
